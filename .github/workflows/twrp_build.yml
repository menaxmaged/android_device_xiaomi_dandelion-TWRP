name: Build TWRP for Blossom

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout your Device Tree
        uses: actions/checkout@v3
        with:
          path: device_tree

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Sync TWRP Source (Android 12.1)
        run: |
          mkdir workspace
          cd workspace
          ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree to Workspace
        run: |
          cd workspace
          mkdir -p device/xiaomi/blossom
          cp -r ../device_tree/* device/xiaomi/blossom/

      - name: Build Recovery Image
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_blossom-eng
          mka recoveryimage

      - name: Upload TWRP Artifact
        uses: actions/upload-artifact@v3
        with:
          name: TWRP-Blossom-Recovery
          path: workspace/out/target/product/blossom/recovery.img